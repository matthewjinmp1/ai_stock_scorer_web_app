services:
  - type: web
    name: ai-stock-scorer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_gunicorn.py
    envVars:
      - key: PYTHONPATH
        value: ${PWD}
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_KEEPALIVE
        value: "5"
